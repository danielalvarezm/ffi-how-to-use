version: '3'

# Resolve paths from the Taskfile, even when Task is invoked from a subdirectory.
dir: '{{.ROOT_DIR}}'

tasks:
  build:
    desc: Build the C shared library and smoke example
    cmds:
      - cmake -S native_code -B native_code/build
      - cmake --build native_code/build

  ffigen:
    desc: Regenerate Dart bindings (requires dart pub get and libclang)
    cmds:
      - dart run tool/ffigen.dart

  generate:
    desc: Install locked dependencies, generate bindings and build C (in order)
    cmds:
      - dart pub get --enforce-lockfile
      - task: ffigen
      - task: build

  execute:
    desc: Run the prepared Dart example
    cmds:
      - dart run bin/ffi_example.dart

  run:
    desc: Prepare and run the Dart example
    cmds:
      - task: generate
      - task: execute

  test:
    desc: Prepare and test both bindings
    cmds:
      - task: generate
      - dart test

  check:
    desc: Check Dart formatting and static analysis
    cmds:
      - dart format --output=none --set-exit-if-changed bin lib test tool
      - dart analyze --fatal-infos

  default:
    cmds:
      - task --list
