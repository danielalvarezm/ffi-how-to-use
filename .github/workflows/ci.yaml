name: Linux checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: '3.13.6'
      - name: Install native tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake libclang-18-dev
      - name: Install locked Dart dependencies
        run: dart pub get --enforce-lockfile
      - name: Regenerate and check committed bindings
        run: |
          dart run tool/ffigen.dart
          git diff --exit-code -- lib/generated_bindings.dart
      - name: Check formatting and analysis
        run: |
          dart format --output=none --set-exit-if-changed bin lib test tool
          dart analyze --fatal-infos
      - name: Build and run native example
        run: |
          cmake -S native_code -B native_code/build
          cmake --build native_code/build
          ./native_code/build/app
      - name: Run Dart example
        run: dart run bin/ffi_example.dart
      - name: Test manual and generated bindings
        run: dart test
